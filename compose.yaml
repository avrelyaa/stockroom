services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - stockroom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  stockroom_postgres:
